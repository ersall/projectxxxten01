<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Админ - коды доступа</title>
  <style>
    body { font-family: system-ui,-apple-system,sans-serif; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f5f6f8; }
    .box { width:min(500px,95vw); background:#fff; border-radius:14px; padding:22px; box-shadow:0 10px 30px rgba(0,0,0,.08); }
    h3 { margin:0 0 10px; }
    h4 { margin:20px 0 8px; font-size:14px; color:#555; }
    input, select { width:100%; padding:12px; border-radius:10px; border:1px solid #d9dce3; font-size:15px; margin-top:6px; }
    button { width:100%; padding:14px; border-radius:10px; border:none; background:#f14635; color:#fff; font-weight:700; cursor:pointer; margin-top:8px; font-size:15px; }
    button:disabled { opacity:.6; }
    .code { font-size:32px; font-weight:800; letter-spacing:6px; text-align:center; margin:10px 0; }
    .pill { display:inline-block; padding:5px 10px; border-radius:999px; background:#f0f2f6; color:#333; font-size:11px; margin:4px; }
    .danger { background:#ffe4e6; color:#be123c; border:1px solid #fecdd3; }
    .msg { margin-top:8px; font-size:13px; color:#666; }
    #out, #revokeBox, #statsBox { display:none; }
    table { width:100%; border-collapse:collapse; margin-top:10px; font-size:12px; }
    th { text-align:left; color:#888; padding:6px; border-bottom:1px solid #eee; }
    td { padding:8px 6px; border-bottom:1px solid #f5f5f5; }
    .btn-sm { padding:6px 12px; font-size:12px; width:auto; }
  </style>
</head>
<body>
<div class="box">
  <h3>🔐 Админ-панель</h3>
  
  <div id="loginBox">
    <input id="pass" type="password" placeholder="Пароль">
    <button onclick="login()">Войти</button>
    <div class="msg" id="msgLogin"></div>
  </div>

  <div id="panel" style="display:none">
    <h4>🎫 Создать код доступа</h4>
    <input id="name" placeholder="Имя клиента / номер чека">
    <select id="ttl">
      <option value="604800">7 дней</option>
      <option value="1209600">14 дней</option>
      <option value="2592000" selected>30 дней</option>
      <option value="7776000">3 месяца</option>
      <option value="31536000">1 год</option>
    </select>
    <button onclick="createCode()">Создать одноразовый код</button>
    <div id="out">
      <div class="code" id="code"></div>
      <div class="pill" id="info"></div>
      <button onclick="copyCode()" style="background:#0088cc">📋 Скопировать</button>
    </div>
    <div class="msg" id="msgCreate"></div>

    <h4>❌ Забрать доступ</h4>
    <div id="revokeBox">
      <input id="revokeName" placeholder="Имя клиента для отзыва">
      <button class="danger btn-sm" onclick="revokeAccess()" style="width:auto;">Забрать доступ</button>
      <div class="msg" id="msgRevoke"></div>
    </div>

    <h4>📋 Активные доступы</h4>
    <div id="statsBox">
      <table id="statsTable">
        <thead><tr><th>Имя</th><th>Код</th><th>До</th><th></th></tr></thead>
        <tbody id="statsBody"></tbody>
      </table>
      <button onclick="loadStats()" style="background:#666">🔄 Обновить</button>
      <div class="msg" id="msgStats"></div>
    </div>
  </div>
</div>

<script>
let adminPass = '';

async function login() {
    adminPass = document.getElementById('pass').value;
    const r = await fetch('/.netlify/functions/admin', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({pass:adminPass, name:'check', ttl:1})
    });
    if (r.ok) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('panel').style.display = 'block';
        document.getElementById('revokeBox').style.display = 'block';
        document.getElementById('statsBox').style.display = 'block';
        loadStats();
    } else {
        document.getElementById('msgLogin').textContent = 'Неверный пароль';
    }
}

async function createCode() {
    const name = document.getElementById('name').value || 'User';
    const ttl = parseInt(document.getElementById('ttl').value);
    const btn = document.querySelector('#panel button');
    btn.disabled = true;
    
    const r = await fetch('/.netlify/functions/admin', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({pass:adminPass, name, ttl})
    });
    const data = await r.json();
    if (r.ok) {
        document.getElementById('code').textContent = data.code;
        const days = Math.round(ttl/86400);
        document.getElementById('info').textContent = `Срок: ${days} дн. | Имя: ${name} | Устройство: ${navigator.platform || 'Неизвестно'}`;
        document.getElementById('out').style.display = 'block';
        document.getElementById('msgCreate').textContent = '';
        loadStats();
    } else {
        document.getElementById('msgCreate').textContent = 'Ошибка';
    }
    btn.disabled = false;
}

function copyCode() {
    const code = document.getElementById('code').textContent;
    navigator.clipboard.writeText(code);
    alert('Скопировано: ' + code);
}

async function revokeAccess() {
    const name = document.getElementById('revokeName').value;
    if (!name) return;
    
    const r = await fetch(`https://sharp-boxer-145758.upstash.io/del/access:${name}`, {
        headers: { Authorization: `Bearer gQAAAAAAAjleAAIgcDJkYjRlZTgzNDVkODY0ZDBlOTBlY2U2MzBiZjE2MDA1NA` }
    });
    
    if (r.ok) {
        document.getElementById('msgRevoke').textContent = `Доступ для "${name}" отозван`;
        loadStats();
    } else {
        document.getElementById('msgRevoke').textContent = 'Ошибка или пользователь не найден';
    }
}

async function loadStats() {
    document.getElementById('msgStats').textContent = 'Загрузка...';
    try {
        const r = await fetch('https://sharp-boxer-145758.upstash.io/keys/code:*', {
            headers: { Authorization: `Bearer gQAAAAAAAjleAAIgcDJkYjRlZTgzNDVkODY0ZDBlOTBlY2U2MzBiZjE2MDA1NA` }
        });
        const data = await r.json();
        const keys = data.result || [];
        
        let html = '';
        for (const key of keys) {
            const r2 = await fetch(`https://sharp-boxer-145758.upstash.io/get/${key}`, {
                headers: { Authorization: `Bearer gQAAAAAAAjleAAIgcDJkYjRlZTgzNDVkODY0ZDBlOTBlY2U2MzBiZjE2MDA1NA` }
            });
            const d2 = await r2.json();
            if (d2.result) {
                try {
                    const info = JSON.parse(d2.result);
                    const expires = new Date(info.expiresAt).toLocaleString('ru-RU');
                    html += `<tr><td>${info.name}</td><td>${key.replace('code:','')}</td><td>${expires}</td><td><button class="btn-sm danger" onclick="revokeByName('${info.name}')">Отозвать</button></td></tr>`;
                } catch(e) {}
            }
        }
        document.getElementById('statsBody').innerHTML = html || '<tr><td colspan="4">Нет активных кодов</td></tr>';
        document.getElementById('msgStats').textContent = keys.length ? `Найдено кодов: ${keys.length}` : '';
    } catch(e) {
        document.getElementById('msgStats').textContent = 'Ошибка загрузки';
    }
}

function revokeByName(name) {
    document.getElementById('revokeName').value = name;
    revokeAccess();
}
</script>
</body>
</html>
