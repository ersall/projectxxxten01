<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Магазин - Kaspi.kz</title>
<style>
:root { --kaspi-red: #f14635; --text-main: #212121; --text-secondary: #8a8a8e; --white: #ffffff; --border-light: #e5e5e5; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, system-ui, Helvetica, sans-serif; background: #fff; color: var(--text-main); padding-bottom: 80px; }
.header { display: flex; align-items: center; padding: 10px 16px; gap: 12px; border-bottom: 1px solid #f0f0f0; position: sticky; top: 0; background: #fff; z-index: 100; }
.header-back { font-size: 24px; color: var(--kaspi-red); text-decoration: none; cursor: pointer; width: 24px; }
.header-title { font-size: 17px; font-weight: 600; flex: 1; text-align: center; }
.header-cart { width: 24px; height: 24px; position: relative; cursor: pointer; }
.header-cart img { width: 100%; height: 100%; }
.cart-badge { position: absolute; top: -6px; right: -6px; background: var(--kaspi-red); color: #fff; font-size: 10px; min-width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.search-bar { margin: 10px 16px; background: #f5f5f5; border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; gap: 8px; color: #8a8a8e; font-size: 14px; }
.categories { display: flex; overflow-x: auto; padding: 0 12px; gap: 8px; scrollbar-width: none; }
.categories::-webkit-scrollbar { display: none; }
.cat-item { flex-shrink: 0; padding: 8px 16px; background: #f5f5f5; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.cat-item.active { background: var(--kaspi-red); color: #fff; }
.products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 16px; }
.product-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); cursor: pointer; transition: transform 0.2s; }
.product-card:hover { transform: translateY(-2px); }
.product-image { width: 100%; height: 160px; background: #f9f9f9; display: flex; align-items: center; justify-content: center; }
.product-image img { max-width: 80%; max-height: 80%; object-fit: contain; }
.product-info { padding: 10px; }
.product-title { font-size: 13px; font-weight: 500; line-height: 1.3; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.product-price { font-size: 16px; font-weight: 700; color: var(--text-main); }
.product-old-price { font-size: 12px; color: #8a8a8e; text-decoration: line-through; margin-left: 6px; }
.nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #fff; border-top: 1px solid #e5e5e5; display: flex; z-index: 100; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: #8a8a8e; font-size: 10px; }
.nav-item.active { color: var(--kaspi-red); }
.nav-item img { width: 24px; height: 24px; margin-bottom: 4px; }
.red-filter { filter: invert(38%) sepia(58%) saturate(4642%) hue-rotate(346deg) brightness(96%) contrast(92%); }
.gray-filter { filter: invert(60%) sepia(0%) saturate(0%) brightness(95%) contrast(90%); }
</style>
</head>
<body>
<div class="header">
  <a href="index.html" class="header-back">‹</a>
  <div class="header-title">Магазин</div>
  <div class="header-cart"><img src="cart-500.svg" class="red-filter"><div class="cart-badge">3</div></div>
</div>
<div class="search-bar">🔍 Поиск по магазину</div>
<div class="categories">
  <div class="cat-item active">Все</div>
  <div class="cat-item">Электроника</div>
  <div class="cat-item">Бытовая техника</div>
  <div class="cat-item">Одежда</div>
  <div class="cat-item">Красота</div>
  <div class="cat-item">Спорт</div>
  <div class="cat-item">Авто</div>
</div>
<div class="products-grid" id="products"></div>
<nav class="nav-bar">
  <a href="index.html" class="nav-item"><img src="homeq.svg" class="gray-filter">Главная</a>
  <a class="nav-item active"><img src="cart-500.svg" class="red-filter">Магазин</a>
  <a class="nav-item"><img src="chat-500.svg" class="gray-filter">Сообщения</a>
  <a class="nav-item"><img src="serv.svg" class="gray-filter">Сервисы</a>
</nav>
<script>
const products = [
  {title:"Apple iPhone 17 Pro Max 256Gb", price:"1 299 990 ₸", img:"64168413.jpg"},
  {title:"Apple iPhone 13 128Gb Black", price:"349 990 ₸", img:"84378448199710.jpg"},
  {title:"Samsung Galaxy S25 Ultra", price:"1 199 990 ₸", img:"61291251.jpg"},
  {title:"Зарядное устройство Apple 20W USB-C", price:"8 990 ₸", img:"63961934823454.jpg"},
  {title:"Холдер Менюхолдер А4", price:"2 490 ₸", img:"21450051.jpg"},
  {title:"Папка Sima-land пластиковая", price:"1 800 ₸", img:"60621934.jpeg"},
  {title:"MacBook Air 15 M3", price:"899 990 ₸", img:"64168413.jpg"},
  {title:"iPad Pro 12.9 M2", price:"749 990 ₸", img:"84378448199710.jpg"},
  {title:"AirPods Pro 2", price:"119 990 ₸", img:"63961934823454.jpg"},
  {title:"Apple Watch Ultra 2", price:"449 990 ₸", img:"61291251.jpg"},
  {title:"Sony PlayStation 5", price:"299 990 ₸", img:"21450051.jpg"},
  {title:"Xbox Series X", price:"279 990 ₸", img:"60621934.jpeg"},
];
document.getElementById('products').innerHTML = products.map(p => `
  <div class="product-card" onclick="alert('Товар: ${p.title}\\nЦена: ${p.price}\\n\\nЭто демо-версия магазина.')">
    <div class="product-image"><img src="${p.img}" alt="${p.title}"></div>
    <div class="product-info">
      <div class="product-title">${p.title}</div>
      <div class="product-price">${p.price}</div>
    </div>
  </div>
`).join('');
document.querySelectorAll('.cat-item').forEach(el => el.addEventListener('click', function() {
  document.querySelectorAll('.cat-item').forEach(c => c.classList.remove('active'));
  this.classList.add('active');
}));
</script>
</body>
</html>
